<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{STYLE_CSS}} 'unsafe-inline'; script-src {{GRAPH_JS}};">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{STYLE_CSS}}">
  <title>CI Graph Overlay</title>
</head>
<body>
  <div id="header">
    <h2>CI Graph</h2>
    <span id="tick-label">—</span>
    <span id="status-badge">—</span>
  </div>

  <div id="graph-chain"></div>

  <div id="violations-section" style="display:none">
    <h3>⚠ Violations</h3>
    <div id="violations-list"></div>
  </div>

  <div id="meta-footer">
    <span id="meta-version">—</span>
    <span id="meta-hash">—</span>
    <span id="meta-schema">—</span>
  </div>

  <div id="empty-state">
    Waiting for CI Graph artifact…<br>
    Run simulation with <code>EARTHLY_CI_GRAPH=true</code> to start live updates.
  </div>

  <script src="{{GRAPH_JS}}"></script>
</body>
</html>
