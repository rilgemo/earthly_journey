<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{STYLE_CSS}} 'unsafe-inline'; script-src {{GRAPH_JS}};">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{STYLE_CSS}}">
  <title>CI Graph Overlay</title>
</head>
<body>

  <!-- ─── Header ─────────────────────────────────────────────────────── -->
  <div id="header">
    <h2>CI Graph</h2>
    <span id="tick-label">—</span>
  </div>

  <!-- ─── Drift Meter ─────────────────────────────────────────────────── -->
  <div id="drift-section">
    <div id="drift-row">
      <span class="section-label">CAUSAL DRIFT</span>
      <span id="drift-score">—</span>
      <span id="drift-label"></span>
    </div>
    <div id="drift-track"><div id="drift-bar"></div></div>
  </div>

  <!-- ─── Node Chain ──────────────────────────────────────────────────── -->
  <div class="panel">
    <div class="panel-title">Nodes</div>
    <div id="node-chain"></div>
  </div>

  <!-- ─── Edge Diff Panel ─────────────────────────────────────────────── -->
  <div class="panel">
    <div class="panel-title">Edges</div>
    <div id="edge-list"></div>
  </div>

  <!-- ─── Violation List ──────────────────────────────────────────────── -->
  <div id="violation-section" class="hidden">
    <div class="panel-title violation-title">⚠ Violations</div>
    <div id="violation-list"></div>
  </div>

  <script src="{{GRAPH_JS}}"></script>
</body>
</html>
